<h2>What a data science interview looks like</h2>
<div class="tw"><table>
<tr><th>Round</th><th>Length</th><th>What happens</th></tr>
<tr><td>Recruiter / HR screen</td><td>15–30 min</td><td>Background, why data science, notice period, pay.</td></tr>
<tr><td>Online test or AI interview</td><td>45–90 min</td><td>2–4 SQL queries, a pandas or Python task, and ML/stats questions: multiple choice, or spoken in an AI interview.</td></tr>
<tr><td>Take-home (some companies)</td><td>1–3 days</td><td>A dataset to clean, explore and model, plus a short write-up you present later.</td></tr>
<tr><td>Technical rounds (2–4)</td><td>45–60 min each</td><td>Live SQL or pandas, statistics and probability, ML theory, and a deep dive into your projects.</td></tr>
<tr><td>Product case / A/B test</td><td>45 min</td><td>Pick a success metric, explain why a metric dropped, design an experiment. Most common in product-analytics DS roles.</td></tr>
<tr><td>Hiring manager / behavioral</td><td>30–45 min</td><td>STAR stories: ownership, a failure, teamwork, learning fast.</td></tr>
</table></div>
<p class="small muted">The usual pattern in 2025–26 prep guides and candidate reports. Rounds vary by company, and startups often merge them into 2–3 calls.</p>

<h3>What gets asked</h3>
<ul>
<li><b>SQL:</b> joins, GROUP BY / HAVING, CASE, CTEs, window functions (RANK, LAG/LEAD, running totals), dates, top-N per group, percentages, retention and funnels.</li>
<li><b>Python:</b> pandas (merge, groupby, pivot, dates, missing values) and easy-to-medium coding (strings, arrays, dictionaries). Sometimes a metric or a simple model in NumPy.</li>
<li><b>Statistics and probability:</b> distributions, CLT, confidence intervals, p-values, power and sample size, Bayes, expected-value puzzles, A/B testing pitfalls.</li>
<li><b>Machine learning:</b> bias–variance, regularization, metrics (precision/recall, ROC-AUC), trees, random forests, boosting, logistic regression, cross-validation, leakage, class imbalance, feature engineering, and "how would you build X?". LLM basics (embeddings, RAG, evaluation) now come up often too.</li>
<li><b>Product sense:</b> metrics, diagnosing a drop, experiment design.</li>
</ul>

<h3>How the weighting changes by role</h3>
<div class="tw"><table>
<tr><th>Role</th><th>SQL</th><th>Python</th><th>Stats &amp; A/B</th><th>ML theory</th><th>Product case</th><th>DSA</th><th>ML system design</th></tr>
<tr><td>Data Scientist (product / analytics)</td><td class="dots">●●●</td><td class="dots">●●</td><td class="dots">●●●</td><td class="dots">●</td><td class="dots">●●●</td><td>–</td><td>–</td></tr>
<tr><td>Data Scientist (ML / modeling)</td><td class="dots">●●</td><td class="dots">●●</td><td class="dots">●●</td><td class="dots">●●●</td><td class="dots">●●</td><td class="dots">●</td><td class="dots">●●</td></tr>
<tr><td>ML Engineer</td><td class="dots">●</td><td class="dots">●●●</td><td class="dots">●</td><td class="dots">●●</td><td>–</td><td class="dots">●●●</td><td class="dots">●●●</td></tr>
<tr><td>Applied Scientist</td><td class="dots">●</td><td class="dots">●●</td><td class="dots">●●</td><td class="dots">●●●</td><td class="dots">●</td><td class="dots">●●</td><td class="dots">●●</td></tr>
</table></div>
<p class="small muted">Typical weighting; companies differ. Applied Scientist roles usually prefer an MS or PhD and go deep into ML math.</p>

<h2>What this means for freshers</h2>
<ul>
<li>Fresher DS/ML roles, especially remote and startup ones, usually mean an online test or AI interview (SQL, pandas, ML/stats), then 1–2 calls that dig into your projects. Long product-case loops and DSA rounds are less common.</li>

<li>Coding (SQL, pandas) is where most freshers need the most practice, so most of the hours go there. For stats and ML theory, the work is explaining answers out loud in about 90 seconds.</li>
<li>If you're also preparing for GATE DA: it covers probability, statistics, linear algebra, ML and DBMS, so that prep counts as interview prep for those topics.</li>
<li>Heavy DSA practice mostly matters for MLE and Applied Scientist loops at large companies. It's parked in the "Later" tab.</li>
</ul>

<h2>Do you need a playlist like Striver's?</h2>
<p>No. In data science the "sheet" is the problem list, which is this page. Use videos only to fill gaps:</p>
<div class="tw"><table>
<tr><th>Topic</th><th>What to use</th></tr>
<tr><td>SQL</td><td>Enough on its own: the <a href="https://datalemur.com/blog/learn-sql-in-30-days-roadmap" target="_blank" rel="noopener">DataLemur 30-day roadmap</a> plus <a href="https://www.thoughtspot.com/sql-tutorial" target="_blank" rel="noopener">Mode's advanced SQL</a>. If a pattern confuses you, look it up on YouTube; <a href="https://www.youtube.com/results?search_query=ankit+bansal+sql+interview+questions" target="_blank" rel="noopener">Ankit Bansal</a> explains many interview SQL problems.</td></tr>
<tr><td>pandas</td><td><a href="https://www.kaggle.com/learn/pandas" target="_blank" rel="noopener">Kaggle Learn: Pandas</a> (free, about 4 hours). The one short course worth doing.</td></tr>
<tr><td>Stats and probability</td><td><a href="https://stat110.hsites.harvard.edu/" target="_blank" rel="noopener">Harvard Stat 110</a>: free lectures and practice problems with solutions. It's also GATE DA practice.</td></tr>
<tr><td>ML</td><td><a href="https://www.youtube.com/@statquest" target="_blank" rel="noopener">StatQuest</a> as a lookup: one 10–20 minute video per concept. If you want one structured series, <a href="https://www.youtube.com/results?search_query=campusx+100+days+of+machine+learning" target="_blank" rel="noopener">CampusX "100 Days of Machine Learning"</a> (Hindi); pick the practical videos only.</td></tr>
<tr><td>A/B testing</td><td><a href="https://www.udacity.com/course/ab-testing--ud257" target="_blank" rel="noopener">Udacity: A/B Testing by Google</a> (free).</td></tr>
</table></div>

<h2>Order of attack: every subject, every week</h2>
<p>Don't finish SQL before starting the rest. Each week you do some SQL, pandas, stats and probability, and ML, plus re-solves of older questions, so nothing goes cold. The <b>Today's plan</b> tab picks the exact questions for each day and brings old ones back for review. It starts the first day you open it.</p>
<ul>
<li><b>Monday to Saturday, about 80 minutes:</b> 2 SQL and 2 pandas every day, then either 3 stats and probability questions (Mon, Wed, Fri) or 5 ML questions answered out loud (Tue, Thu, Sat), then 2 re-solves.</li>
<li><b>Sunday:</b> no new questions. Up to 8 re-solves and 1 project or A/B item.</li>
<li><b>At this pace</b> the <span class="n-core">500</span> core items take about 11 weeks.</li>
<li><b>After that: polish.</b> Project deep-dives, a practice take-home, mock interviews. Keep the 30-day SQL roadmap and Mode as your reading alongside the questions.</li>
</ul>

<h2>Why there are no paid questions</h2>
<ul>
<li>Paid questions on DataLemur and LeetCode are left out. The free problems that train the same patterns are already in the lists; in SQL D those are marked core instead of optional.</li>
<li>DataLemur's paid stats and ML questions are mostly concept questions. The free GitHub answer banks and Brainstellar cover the same concepts with answers on the page.</li>
<li>A question that appears on two sites in the same words is listed on both but ticks together, so you see it as done wherever you meet it.</li>
</ul>

<h2>How to use this sheet</h2>
<ul>
<li>Tick a box when you've solved it. Ticks are saved in this browser, so clearing its history and site data, or switching browsers, resets them.</li>
<li>Items that are the <b>same problem</b> on two sites tick together, so you never solve one twice.</li>
<li>For GitHub answer-bank items, the link opens the question (or its topic for Grigorev's list) with the answer underneath. Answer out loud before you scroll down.</li>
<li>Search also matches concepts (try "window" or "A/B"). The level filter, "Core only" and search narrow the list, and every count follows them: the tab counts, each group's count and the line under the filters.</li>
<li><b>Core only</b> hides the <span class="n-opt">140</span> items marked <span class="opt">optional</span> and leaves the <span class="n-core">500</span> core items. The optional ones are HackerRank's Easy warm-ups and its SQL (Advanced) certificate test, extra LeetCode SQL practice, 2 "deadly" puzzles, the deep-learning, text, ranking, recommender and time-series theory, and the "Later" tab.</li>

</ul>
<div class="legend"><span class="pf pf-dl">DataLemur</span><span class="pf pf-lc">LeetCode</span><span class="pf pf-hr">HackerRank</span><span class="pf pf-ot">Other free sites</span><span class="opt">optional</span></div>

<h3>Habits for every coding round</h3>
<ul>
<li>Clarify first: duplicates? NULLs? ties? date range?</li>
<li>Say your plan in one sentence, write it, then check edge cases out loud.</li>
<li>DataLemur uses PostgreSQL; many online tests use MySQL. Know both for dates and strings.</li>
</ul>
<p class="small muted">Interview-format sources: <a href="https://www.tryexponent.com/blog/data-science-interview-guide" target="_blank" rel="noopener">Exponent DS interview guide</a>, <a href="https://careerhub.students.duke.edu/blog/2025/05/23/data-science-interview-prep-2025-guide/" target="_blank" rel="noopener">Duke career hub 2025 guide</a>, <a href="https://www.interviewquery.com/guides/databricks-data-scientist" target="_blank" rel="noopener">Interview Query (Databricks DS)</a>, <a href="https://dataford.io/roles/data-scientist" target="_blank" rel="noopener">Dataford DS role guide</a>.</p>

<h2>Where each subject stands (core questions)</h2>
<div id="pl-tracks"></div>
<p class="small muted">Dates assume you follow the weekly plan below. When a subject's core list is finished, its daily slots move to its partner (SQL and pandas swap, stats and ML swap), so the rest speeds up.</p>

<h2>The weekly plan</h2>
<p>About 80 minutes a day. SQL and pandas get a slot every day because coding is where most people need the most practice. Theory alternates between stats and ML.</p>
<div class="tw"><table>
<tr><th>Day</th><th>SQL</th><th>pandas / Python</th><th>Theory</th><th>Review</th></tr>
<tr><td>Mon, Wed, Fri</td><td>2 new</td><td>2 new</td><td>3 stats &amp; probability</td><td>2 re-solves</td></tr>
<tr><td>Tue, Thu, Sat</td><td>2 new</td><td>2 new</td><td>5 ML questions, out loud</td><td>2 re-solves</td></tr>
<tr><td>Sunday</td><td colspan="3">No new questions. 1 project or A/B item from "Case &amp; projects".</td><td>up to 8 re-solves</td></tr>
</table></div>
<p class="small muted">Per week: 12 SQL, 12 pandas, 9 stats and probability, 15 ML, 1 project or case item, and about 20 re-solves.</p>

<h3>How the review stops you forgetting</h3>
<ul>
<li>When you tick a question, it comes back here for a re-solve <b>3 days</b> later, then <b>7 days</b> after that, then <b>21</b>. After the third re-solve it's retired.</li>
<li>Re-solve from a blank editor, or answer out loud, then press <b>Re-solved</b>. If you couldn't do it, leave it: it stays on the list until you can.</li>

</ul>

<h3>Rules that make it work</h3>
<ul>
<li>The order inside each subject is set for you:
  <ul>
  <li><b>SQL:</b> alternates LeetCode SQL 50 and DataLemur, then HackerRank Medium and Hard, then the core items of D.</li>
  <li><b>pandas:</b> starts with the Kaggle course (one lesson a day, tick it when the course is finished), then LeetCode's two pandas plans, then DataLemur Python.</li>
  <li><b>Theory:</b> mixes puzzles and concept questions.</li>
  </ul></li>
<li>Stuck for 20 minutes? Read the solution, write it yourself, and leave the box unticked. It comes back the next time that subject is on the plan.</li>
<li>On a busy day, do just the SQL and the review.</li>
<li>Today's list stays fixed for the day. Ticking a question anywhere in the sheet also ticks it here.</li>
</ul>
</template>

  $('#nav').innerHTML = DATA.sections.map(s => {
    let badge = '';
    if (s.id === 'plan') badge = started() ? todayProgress().join('/') : '';
    else { const all = ALL.filter(i => i.s === s.id); if (all.length) badge = count(all.filter(match)).join('/'); }
    return `<button data-tab="${s.id}" class="${S.tab === s.id ? 'on' : ''}">${esc(s.title)}${badge ? `<small>${badge}</small>` : ''}</button>`;
  }).join('');
  const [d, t] = count(ALL);
  $('#pt').textContent = `${d} / ${t} done`;
  $('#pb').style.width = (t ? 100 * d / t : 0).toFixed(1) + '%';
}

function renderSection() {
  const s = DATA.sections.find(x => x.id === S.tab) || DATA.sections[0];
  if (s.static) {
    $('#main').innerHTML = document.getElementById('tpl-' + s.id).innerHTML;
    const [d, t] = count(ALL);
    if ($('#st-total')) { $('#st-total').textContent = t; $('#st-done').textContent = d; }
    if ($('#st-start')) $('#st-start').textContent = longDate(START);
    const nCore = ALL.filter(i => i.core).length;
    document.querySelectorAll('.n-core').forEach(e => { e.textContent = nCore; });
    document.querySelectorAll('.n-opt').forEach(e => { e.textContent = ALL.length - nCore; });
    if (s.id === 'plan') renderPlan();
    return;
  }
  const f = S.f;
  $('#main').innerHTML = `<div class="intro">${s.intro}</div>
    <div class="filters"><input type="search" id="fq" placeholder="Search title, company or concept (e.g. window)" value="${esc(f.q)}">
    <select id="fd" aria-label="Level"><option value="">All levels</option><option value="E">Easy</option><option value="M">Medium</option><option value="H">Hard</option></select>
    <label><input type="checkbox" id="fh"${f.hide ? ' checked' : ''}> Hide done</label>
    <label title="Hide the items marked optional (extra practice)"><input type="checkbox" id="fc"${f.core ? ' checked' : ''}> Core only</label></div><p class="fsum" id="fsum"></p><div id="list"></div>`;
  $('#fd').value = f.d;
  const upd = () => { save(); renderNav(); renderList(); };
  $('#fq').addEventListener('input', e => { f.q = e.target.value; upd(); });
  $('#fd').addEventListener('change', e => { f.d = e.target.value; upd(); });
  $('#fh').addEventListener('change', e => { f.hide = e.target.checked; upd(); });
  $('#fc').addEventListener('change', e => { f.core = e.target.checked; upd(); });
  renderList();
}

function row(i) {
  const bits = [`<span class="pf pf-${i.pc}">${esc(i.p)}</span>`];
  if (i.d) bits.push(`<span class="df df-${i.d}">${DN[i.d]}</span>`);
  if (i.a) bits.push(ACC[i.a] || '');
  if (!i.core) bits.push('<span class="opt">optional</span>');
  if (i.c) bits.push(`<span class="co">${esc(i.c)}</span>`);
  const alts = i.alts && i.alts.length ? `<div class="alts"><span class="al">${esc(i.al || 'Free substitute')}:</span> ${i.alts.map(a => link(a.u, a.t)).join(' · ')}</div>` : '';
  return `<li class="row${S.done[i.k] ? ' done' : ''}"><label class="cb"><input type="checkbox" data-k="${esc(i.k)}"${S.done[i.k] ? ' checked' : ''} aria-label="Done: ${esc(i.t)}"></label>
    <div class="rm"><div class="l1">${i.u ? link(i.u, i.t, 'tt') : `<span class="tt">${esc(i.t)}</span>`}${bits.join('')}</div>
    ${i.g ? `<div class="tg">${esc(i.g)}</div>` : ''}${i.idea ? `<div class="nt"><b>Key idea:</b> ${esc(i.idea)}</div>` : ''}${i.n ? `<div class="nt">${esc(i.n)}</div>` : ''}${alts}</div></li>`;
}

function renderList() {
  const s = DATA.sections.find(x => x.id === S.tab);
  const on = filtersOn(), seen = [];
  let all = 0, shown = 0;
  $('#list').innerHTML = s.groups.map(g => {
    const m = g.items.filter(match), vis = m.filter(pass);
    const [d, t] = count(m);
    seen.push(...m); all += g.items.length; shown += vis.length;
    const open = g.id in S.shut ? !S.shut[g.id] : g.open !== false;
    const rows = vis.map(row).join('') || '<li class="empty">Nothing here matches the filters.</li>';
    const of = on && t !== g.items.length ? ` <span class="of">· ${g.items.length} in all</span>` : '';
    return `<details class="grp" data-g="${g.id}"${open ? ' open' : ''}><summary>${esc(g.title)}<span class="gc">${d} / ${t}${of}</span></summary>${g.note ? `<p class="gn">${esc(g.note)}</p>` : ''}<ul class="rows">${rows}</ul></details>`;
  }).join('');
  const [d, t] = count(seen);
  const what = [S.f.d && DN[S.f.d], S.f.core && 'core only', S.f.q.trim() && `matching "${S.f.q.trim()}"`].filter(Boolean).join(', ');
  $('#fsum').innerHTML = (on ? `<b>${t}</b> of ${all} questions in this tab (${esc(what)})` : `<b>${t}</b> questions in this tab`) +
    `, ${d} done` + (S.f.hide ? `; ${shown} not done are shown` : '');
}

function rvRow(i, done) {
  const r = S.rv[i.k], n = r ? r.n + 1 : 3;
  return `<li class="row${done ? ' done' : ''}"><div class="rm"><div class="l1">${i.u ? link(i.u, i.t, 'tt') : `<span class="tt">${esc(i.t)}</span>`}<span class="pf pf-${i.pc}">${esc(i.p)}</span>${i.d ? `<span class="df df-${i.d}">${DN[i.d]}</span>` : ''}</div>
    <div class="tg">${esc(tabName(i.s))} · ${done ? 'done for today' : `re-solve ${n} of 3`}</div></div>
    <button class="rvb" data-rv="${esc(i.k)}"${done ? ' disabled' : ''}>${done ? 'Re-solved ✓' : 'Re-solved'}</button></li>`;
}

function renderPlan() {
  const go = started();
  $('#pl-more').style.display = go ? '' : 'none';
  if (go) {
    const T = ensureToday(), [d, t] = todayProgress();
    $('#pl-title').textContent = 'Today, ' + new Date().toLocaleDateString(undefined, {weekday: 'long', day: 'numeric', month: 'short'});
    $('#pl-sub').textContent = t ? `${d} of ${t} done` : '';
    const out = T.slots.map(sl => {
      const tr = TRACKS.find(x => x.id === sl.id);
      const rows = sl.keys.map(k => BYK[k]).filter(Boolean).map(row).join('') || `<li class="empty">Every core ${esc(tr.name)} question is done.</li>`;
      return `<section class="slot"><h3>${esc(tr.name)}<span>${sl.keys.filter(k => S.done[k]).length} / ${sl.keys.length}</span></h3><ul class="rows">${rows}</ul></section>`;
    });
    const rv = T.rv.filter(k => BYK[k]);
    out.push(`<section class="slot"><h3>Review: re-solve from memory<span>${rv.filter(k => T.rd[k]).length} / ${rv.length}</span></h3><ul class="rows">${rv.map(k => rvRow(BYK[k], T.rd[k])).join('') || '<li class="empty">Nothing is due for a re-solve today.</li>'}</ul></section>`);
    $('#pl-today').innerHTML = out.join('');
  } else {
    $('#pl-title').textContent = 'Your plan starts on ' + longDate(START);
    $('#pl-sub').textContent = '';
    $('#pl-today').innerHTML = '<p>Nothing is due before then. On that day this tab will list the day\'s questions by itself. If you solve something earlier, tick it in its subject tab and the plan will skip it.</p>';
  }
  $('#pl-tracks').innerHTML = TRACKS.map(tr => {
    const n = tr.items.length, rest = left(tr), dn = n - rest, wk = Math.ceil(rest / PER_WEEK[tr.id]);
    const eta = rest ? ` · about ${wk} week${wk === 1 ? '' : 's'} left, around ${dateOf(day0() + wk * 7)}` : ' · all done';
    return `<div class="trk"><div class="tn"><b>${esc(tr.name)}</b><span class="small muted">${dn} / ${n} done${eta}</span></div><span class="bar"><i style="width:${(n ? 100 * dn / n : 0).toFixed(1)}%"></i></span></div>`;
  }).join('');
}

document.addEventListener('click', e => {
  const rb = e.target.closest('.rvb');
  if (rb) {
    const k = rb.dataset.rv, r = S.rv[k];
    if (r) { if (r.n >= RV_GAP.length) delete S.rv[k]; else S.rv[k] = {d: today() + RV_GAP[r.n], n: r.n + 1}; }
    ensureToday().rd[k] = 1; save(); renderNav(); renderPlan(); return;
  }
  if (e.target.closest('#pl-more')) {
    const T = ensureToday(), taken = new Set();
    T.slots.forEach(s => s.keys.forEach(k => taken.add(BYK[k] ? BYK[k].tw || k : k)));
    makeSet(taken).forEach(x => { const s = T.slots.find(y => y.id === x.id); if (s) s.keys.push(...x.keys); else T.slots.push(x); });
    save(); renderNav(); renderPlan(); return;
  }
  const b = e.target.closest('nav button');
  if (!b) return;
  S.tab = b.dataset.tab; save(); renderNav(); renderSection(); window.scrollTo(0, 0);
});
document.addEventListener('change', e => {
  const k = e.target.dataset && e.target.dataset.k;
  if (!k) return;
  const it = BYK[k], keys = twinsOf(k);
  if (e.target.checked) {
    keys.forEach(x => { S.done[x] = today(); });
    if (it && !it.r && !keys.some(x => S.rv[x])) S.rv[k] = {d: today() + 3, n: 0};
  } else keys.forEach(x => { delete S.done[x]; delete S.rv[x]; });
  save(); renderNav();
  if (S.tab === 'plan') renderPlan(); else renderList();
});
document.addEventListener('toggle', e => {
  const g = e.target.dataset && e.target.dataset.g;
  if (g) { S.shut[g] = !e.target.open; save(); }
}, true);
$('#built').textContent = DATA.built;
renderNav(); renderSection();
</script>
</body>
</html>
